<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DBU BG — Preview</title>
<style>
  :root{ --bg:#f6f7fb; --surface:#ffffff; --text:#1c2033; --muted:#5b6178; --border:#e1e4ee; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14151f; --surface:#1b1d2b; --text:#e8e9f3; --muted:#9498b3; --border:#2b2e42; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:2.5rem 1.25rem 4rem; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  main{max-width:420px; margin:0 auto;}
  h1{font-size:1.3rem; margin:0 0 .3rem;}
  p.sub{color:var(--muted); font-size:.85rem; margin:0 0 1.5rem;}
  .frame{
    width:360px; height:800px; max-width:100%; margin:0 auto;
    border-radius:16px; overflow:hidden; box-shadow:0 20px 50px -20px rgba(0,0,0,.35);
    border:1px solid var(--border); background:var(--surface);
  }
  .frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .caption{text-align:center; color:var(--muted); font-size:.8rem; margin-top:.75rem;}
</style>
</head>
<body>
<main>
  <h1>DBU BG</h1>
  <p class="sub">Frame 2147234833 — dbu bg (figma export).png, 360×800</p>
  <div class="frame">
    <img src="dbu bg (figma export).png" alt="DBU background — Figma export">
  </div>
  <p class="caption">Rendered at native size, as it appears in Figma.</p>
</main>
</body>
</html>
